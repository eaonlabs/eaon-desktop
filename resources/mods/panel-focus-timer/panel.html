<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  /* Eaon sends its colours when the panel loads (see docs/mods.md); these are the fallbacks. */
  :root { --bg: #161616; --surface: #1f1f1f; --raised: #2a2a2a; --text: #f2f2f2; --text2: #b8b8b8; --text3: #8a8a8a; --border: #333; --accent: #0a84ff; --on-accent: #fff; --danger: #ff453a; --font: -apple-system, system-ui, sans-serif; --mono: ui-monospace, Menlo, monospace; --fs: 14px; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: var(--fs) / 1.45 var(--font); display: flex; flex-direction: column; }
  button { font: inherit; color: var(--text); background: var(--raised); border: 0; border-radius: 8px; height: 28px; padding: 0 11px; cursor: pointer; }
  button:hover:not(:disabled) { filter: brightness(1.15); }
  button:disabled { opacity: 0.45; cursor: default; }
  button.primary { background: var(--accent); color: var(--on-accent); font-weight: 500; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  input, textarea, select { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 9px; }
  textarea { font-family: var(--mono); font-size: 12.5px; resize: none; }
  .bar { display: flex; align-items: center; gap: 6px; padding: 10px 12px; }
  .bar .grow { flex: 1; }
  .muted { color: var(--text3); font-size: 12px; }
  .error { color: var(--danger); font-size: 12px; }
</style>
<script>
  // The host calls this panel may make, and the theme it's sent. Messages only: no network, no app access.
  const eaon = (() => {
    let next = 1
    const waiting = new Map()
    const themeListeners = []
    addEventListener('message', (event) => {
      if (event.source !== parent) return
      const m = event.data
      if (!m || m.eaon !== 'mod') return
      if (m.event === 'theme') {
        const t = m.theme, r = document.documentElement.style
        const set = (k, v) => v && r.setProperty(k, v)
        set('--bg', t.background); set('--surface', t.surface); set('--raised', t.raised); set('--text', t.text); set('--text2', t.text2)
        set('--text3', t.text3); set('--border', t.border); set('--accent', t.accent); set('--on-accent', t.onAccent); set('--danger', t.danger)
        set('--font', t.font); set('--mono', t.mono); set('--fs', t.fontSize)
        r.colorScheme = t.mode
        themeListeners.forEach((f) => f(t))
        return
      }
      const pending = waiting.get(m.id)
      if (!pending) return
      waiting.delete(m.id)
      m.ok ? pending.resolve(m.result) : pending.reject(new Error(m.error))
    })
    const call = (name, ...args) => new Promise((resolve, reject) => {
      const id = next++
      waiting.set(id, { resolve, reject })
      parent.postMessage({ eaon: 'mod', id, call: name, args }, '*')
    })
    return {
      get: (key) => call('storage.get', key),
      set: (key, value) => call('storage.set', key, value),
      insert: (text) => call('composer.insert', text),
      notify: (text) => call('notify', text),
      onTheme: (f) => themeListeners.push(f)
    }
  })()
</script>
<title>Focus timer</title>
<style>
  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 16px; }
  .clock { font: 300 56px/1 var(--font); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .ring { width: 190px; height: 190px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--accent) calc(var(--done) * 1turn), var(--raised) 0); }
  .ring > div { width: 172px; height: 172px; border-radius: 50%; background: var(--bg); display: grid; place-items: center; }
  .presets { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .presets button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
  .custom { width: 64px; text-align: center; }
  .label { font-size: 13px; color: var(--text2); }
</style>
</head>
<body>
  <main>
    <span class="label" id="label">Focus</span>
    <div class="ring" id="ring" style="--done: 0"><div><span class="clock" id="clock">25:00</span></div></div>
    <div class="presets" id="presets">
      <button data-min="25" data-kind="Focus">Focus 25</button>
      <button data-min="50" data-kind="Focus">Focus 50</button>
      <button data-min="5" data-kind="Break">Break 5</button>
      <button data-min="15" data-kind="Break">Break 15</button>
      <input class="custom" id="custom" type="number" min="1" max="240" placeholder="min" aria-label="Your own minutes" />
    </div>
    <div class="presets">
      <button id="start" class="primary">Start</button>
      <button id="reset">Reset</button>
    </div>
    <span class="muted" id="today"></span>
  </main>
<script>
  // The end time is saved, so leaving the panel or Eaon doesn't lose a running session.
  let state = { minutes: 25, kind: 'Focus', endsAt: null, left: 25 * 60000, day: '', done: 0 }
  const $ = (id) => document.getElementById(id)
  const today = () => new Date().toISOString().slice(0, 10)
  const save = () => eaon.set('state', JSON.stringify(state)).catch(() => {})
  const fmt = (ms) => { const s = Math.max(0, Math.ceil(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}` }
  const draw = () => {
    const left = state.endsAt ? state.endsAt - Date.now() : state.left
    $('clock').textContent = fmt(left)
    $('ring').style.setProperty('--done', String(1 - Math.max(0, left) / (state.minutes * 60000)))
    $('label').textContent = state.endsAt ? `${state.kind}, running` : state.kind
    $('start').textContent = state.endsAt ? 'Pause' : 'Start'
    if (state.day !== today()) { state.day = today(); state.done = 0 }
    $('today').textContent = `${state.done} focus session${state.done === 1 ? '' : 's'} finished today`
    for (const b of document.querySelectorAll('[data-min]')) b.setAttribute('aria-pressed', String(Number(b.dataset.min) === state.minutes && b.dataset.kind === state.kind))
  }
  const finish = () => {
    if (state.kind === 'Focus') state.done += 1
    eaon.notify(`${state.kind} time is up (${state.minutes} minutes)`).catch(() => {})
    state.endsAt = null
    state.left = state.minutes * 60000
    save()
  }
  const pick = (minutes, kind) => { state = { ...state, minutes, kind, endsAt: null, left: minutes * 60000 }; save(); draw() }
  for (const b of document.querySelectorAll('[data-min]')) b.addEventListener('click', () => pick(Number(b.dataset.min), b.dataset.kind))
  $('custom').addEventListener('change', (e) => { const n = Math.round(Number(e.target.value)); if (n >= 1 && n <= 240) pick(n, 'Focus') })
  $('start').addEventListener('click', () => {
    if (state.endsAt) { state.left = state.endsAt - Date.now(); state.endsAt = null }
    else state.endsAt = Date.now() + state.left
    save(); draw()
  })
  $('reset').addEventListener('click', () => pick(state.minutes, state.kind))
  setInterval(() => { if (state.endsAt && state.endsAt <= Date.now()) finish(); draw() }, 500)
  eaon.get('state').then((saved) => {
    if (saved) try { state = { ...state, ...JSON.parse(saved) } } catch {}
    if (state.endsAt && state.endsAt <= Date.now()) finish()
    draw()
  }, draw)
</script>
</body>
</html>
