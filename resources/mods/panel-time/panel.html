<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  /* Eaon sends its colours when the panel loads (see docs/mods.md); these are the fallbacks. */
  :root { --bg: #161616; --surface: #1f1f1f; --raised: #2a2a2a; --text: #f2f2f2; --text2: #b8b8b8; --text3: #8a8a8a; --border: #333; --accent: #0a84ff; --on-accent: #fff; --danger: #ff453a; --font: -apple-system, system-ui, sans-serif; --mono: ui-monospace, Menlo, monospace; --fs: 14px; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: var(--fs) / 1.45 var(--font); display: flex; flex-direction: column; }
  button { font: inherit; color: var(--text); background: var(--raised); border: 0; border-radius: 8px; height: 28px; padding: 0 11px; cursor: pointer; }
  button:hover:not(:disabled) { filter: brightness(1.15); }
  button:disabled { opacity: 0.45; cursor: default; }
  button.primary { background: var(--accent); color: var(--on-accent); font-weight: 500; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  input, textarea, select { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 9px; }
  textarea { font-family: var(--mono); font-size: 12.5px; resize: none; }
  .bar { display: flex; align-items: center; gap: 6px; padding: 10px 12px; }
  .bar .grow { flex: 1; }
  .muted { color: var(--text3); font-size: 12px; }
  .error { color: var(--danger); font-size: 12px; }
</style>
<script>
  // The host calls this panel may make, and the theme it's sent. Messages only: no network, no app access.
  const eaon = (() => {
    let next = 1
    const waiting = new Map()
    const themeListeners = []
    addEventListener('message', (event) => {
      if (event.source !== parent) return
      const m = event.data
      if (!m || m.eaon !== 'mod') return
      if (m.event === 'theme') {
        const t = m.theme, r = document.documentElement.style
        const set = (k, v) => v && r.setProperty(k, v)
        set('--bg', t.background); set('--surface', t.surface); set('--raised', t.raised); set('--text', t.text); set('--text2', t.text2)
        set('--text3', t.text3); set('--border', t.border); set('--accent', t.accent); set('--on-accent', t.onAccent); set('--danger', t.danger)
        set('--font', t.font); set('--mono', t.mono); set('--fs', t.fontSize)
        r.colorScheme = t.mode
        themeListeners.forEach((f) => f(t))
        return
      }
      const pending = waiting.get(m.id)
      if (!pending) return
      waiting.delete(m.id)
      m.ok ? pending.resolve(m.result) : pending.reject(new Error(m.error))
    })
    const call = (name, ...args) => new Promise((resolve, reject) => {
      const id = next++
      waiting.set(id, { resolve, reject })
      parent.postMessage({ eaon: 'mod', id, call: name, args }, '*')
    })
    return {
      get: (key) => call('storage.get', key),
      set: (key, value) => call('storage.set', key, value),
      insert: (text) => call('composer.insert', text),
      notify: (text) => call('notify', text),
      onTheme: (f) => themeListeners.push(f)
    }
  })()
</script>
<title>Time converter</title>
<style>
  main { padding: 4px 12px 12px; display: flex; flex-direction: column; gap: 10px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--text2); }
  input { width: 100%; font-family: var(--mono); font-size: 13px; }
  .rows { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
  .row { display: flex; align-items: center; gap: 8px; padding: 7px 9px; border-radius: 8px; background: var(--surface); }
  .row b { width: 92px; flex: none; font-weight: 500; font-size: 12px; color: var(--text3); }
  .row code { flex: 1; font: 12.5px var(--mono); overflow-wrap: anywhere; }
  .row button { height: 24px; padding: 0 8px; font-size: 12px; }
</style>
</head>
<body>
  <div class="bar"><span class="grow muted">A Unix timestamp (seconds or milliseconds), or a date like 2026-11-03 14:30.</span><button id="now">Now</button></div>
  <main>
    <label>Timestamp or date<input id="input" spellcheck="false" autocomplete="off" /></label>
    <span id="error" class="error"></span>
    <div class="rows" id="rows"></div>
  </main>
<script>
  const input = document.getElementById('input')
  const rows = document.getElementById('rows')
  const error = document.getElementById('error')
  const zone = Intl.DateTimeFormat().resolvedOptions().timeZone
  const read = (raw) => {
    const value = raw.trim()
    if (!value) return null
    if (/^-?\d+(\.\d+)?$/.test(value)) {
      const n = Number(value)
      // 10^11 seconds is the year 5138: anything bigger is milliseconds.
      return new Date(Math.abs(n) >= 1e11 ? n : n * 1000)
    }
    const date = new Date(/^\d{4}-\d{2}-\d{2} \d/.test(value) ? value.replace(' ', 'T') : value)
    return Number.isNaN(date.getTime()) ? undefined : date
  }
  const relative = (date) => {
    const s = Math.round((date.getTime() - Date.now()) / 1000)
    const units = [['year', 31536000], ['month', 2592000], ['day', 86400], ['hour', 3600], ['minute', 60], ['second', 1]]
    const [unit, size] = units.find(([, size]) => Math.abs(s) >= size) || ['second', 1]
    return new Intl.RelativeTimeFormat(undefined, { numeric: 'auto' }).format(Math.round(s / size), unit)
  }
  const show = () => {
    const date = read(input.value)
    rows.textContent = ''
    error.textContent = date === undefined ? 'That isn’t a timestamp or a date this can read.' : ''
    if (!date) return
    const full = { dateStyle: 'full', timeStyle: 'long' }
    const lines = [
      ['Your time', new Intl.DateTimeFormat(undefined, full).format(date) + ` (${zone})`],
      ['UTC', new Intl.DateTimeFormat(undefined, { ...full, timeZone: 'UTC' }).format(date)],
      ['ISO 8601', date.toISOString()],
      ['Seconds', String(Math.floor(date.getTime() / 1000))],
      ['Milliseconds', String(date.getTime())],
      ['From now', relative(date)]
    ]
    for (const [name, value] of lines) {
      const row = document.createElement('div')
      row.className = 'row'
      const b = document.createElement('b'); b.textContent = name
      const code = document.createElement('code'); code.textContent = value
      const send = document.createElement('button'); send.textContent = 'Add'; send.title = 'Put this in the message box'
      send.onclick = () => eaon.insert(value).catch((e) => (error.textContent = e.message))
      row.append(b, code, send)
      rows.append(row)
    }
  }
  input.addEventListener('input', show)
  document.getElementById('now').onclick = () => { input.value = String(Math.floor(Date.now() / 1000)); show() }
  input.focus()
</script>
</body>
</html>
