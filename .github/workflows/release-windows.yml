name: Release Windows

# Manual only, mirroring scripts/release-mac.sh's --publish flag: nothing
# ships to GitHub Releases unless someone explicitly asks for it here.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the signed installer to GitHub Releases
        type: boolean
        default: false

# id-token is what lets azure/login exchange this run's OIDC token for an
# Azure access token — no client secret is stored anywhere for this.
permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: windows-latest
    # Scopes the OIDC federated credential (see the Azure AD app's
    # federated-credential subject: repo:eaonlabs/eaon-desktop:environment:release)
    # and lets a required reviewer be added later without touching this file.
    environment: release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # The `sign` CLI (dotnet/sign) has no stable release yet — see the
      # comment atop scripts/sign-win.cjs. Pinned so a future prerelease
      # doesn't silently change signing behavior underneath this workflow.
      - name: Install the sign CLI
        shell: bash
        run: |
          dotnet tool install --global --version 0.9.1-beta.26371.2 sign
          echo "$USERPROFILE/.dotnet/tools" >> "$GITHUB_PATH"

      # Authenticates as the eaon-desktop-windows-signing app registration via
      # OIDC. That app holds only the "Artifact Signing Certificate Profile
      # Signer" role on the eaon-signing account — nothing broader.
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - run: npx electron-vite build

      - name: Build and sign
        shell: bash
        env:
          PUBLISH: ${{ inputs.publish && 'always' || 'never' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The certificate's CN — kept as a secret rather than in
          # scripts/sign-win.cjs since this repo is public.
          WIN_SIGN_PUBLISHER_NAME: ${{ secrets.WIN_SIGN_PUBLISHER_NAME }}
        run: npx electron-builder --win --publish "$PUBLISH"

      - name: Manifest values
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          SETUP="dist/Eaon-${VERSION}-setup.exe"
          if [ -f "$SETUP" ]; then
            echo "latestVersion: $VERSION"
            echo "sha256:        $(sha256sum "$SETUP" | awk '{print $1}')"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: eaon-windows-installer
          path: dist/*-setup.exe
