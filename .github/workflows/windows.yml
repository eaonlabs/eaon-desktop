# Windows installer: builds the one-file installer (x64 and arm64 in one NSIS
# .exe), then installs it on a real Windows machine of each arch and starts
# the installed app, the way someone downloading it would.
#
# On a push to a release branch (or by hand) the installer is attached to the
# GitHub release for package.json's version, if that release exists and has
# no Windows files yet. Pull requests only build and test it.
#
# Unsigned unless asked for: run it by hand with "Sign with Azure" ticked to
# sign with Azure Artifact Signing (account eaonsigning, profile eaon-public).
# Off by default because an individual's certificate carries the signer's
# city, state and country (CN=Vishnu Chada, L=San Ramon, S=ca, C=US), and
# Windows shows them as the publisher. When on, the runner signs in to Azure
# with GitHub's OIDC token through the app registration eaon-windows-signing,
# whose federated credential trusts this repository's `windows-signing`
# environment only; no secret is stored.
name: Windows installer

on:
  push:
    branches: ['release/**']
  pull_request:
    paths: ['src/**', 'package.json', 'package-lock.json', 'electron-builder.yml', 'scripts/**', '.github/workflows/windows.yml']
  workflow_dispatch:
    inputs:
      sign:
        description: Sign with Azure (the certificate shows Vishnu Chada, San Ramon, CA, US as the publisher)
        type: boolean
        default: false

permissions:
  contents: read

# Azure Artifact Signing: not secrets, just which tenant, app and account.
env:
  AZURE_TENANT_ID: d373dfd9-95a6-4c7d-bb72-1388a3e97f6b
  AZURE_CLIENT_ID: c4794814-dd63-4b9b-8f27-3a2d08f9cbd2

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installer
    runs-on: windows-latest
    # Signing runs in the environment the Azure app trusts; anything else gets none.
    environment: ${{ inputs.sign && 'windows-signing' || '' }}
    permissions:
      contents: write
      id-token: write
    env:
      SIGN: ${{ inputs.sign == true }}
      ATTACH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --legacy-peer-deps matches how the lockfile was made (betterwright's
      # optional peer wants a newer Electron).
      - name: Install
        run: npm ci --legacy-peer-deps

      # Upstream llama.cpp's own Windows builds (they can't be compiled on a Mac).
      - name: llama-server for Windows
        shell: bash
        run: ./scripts/fetch-llama-windows.sh

      # Cua Driver, the computer-use engine: the pinned, checksummed release.
      - name: Cua Driver
        run: node scripts/fetch-cua-driver.mjs win32-x64 win32-arm64

      # The tokn command, which Eaon ships and puts on PATH: the pinned, checked package.
      - name: tokn
        run: node scripts/fetch-tokn-cli.mjs

      # The runner's Azure sign-in (az CLI), which Invoke-TrustedSigning
      # (electron-builder's azureSignOptions) picks up through
      # DefaultAzureCredential. The app's only role is Certificate Profile
      # Signer on the signing account, so no subscription is selected.
      - name: Sign in to Azure
        if: env.SIGN == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # Signed: signAndEditExecutable back on (rcedit runs natively here, unlike
      # on a Mac), and every executable signed through Artifact Signing.
      - name: Build
        shell: bash
        run: |
          npx electron-vite build
          if [ "$SIGN" = "true" ]; then
            npx electron-builder --win --publish never \
              -c.win.signAndEditExecutable=true \
              -c.win.azureSignOptions.publisherName="Vishnu Chada" \
              -c.win.azureSignOptions.endpoint=https://eus.codesigning.azure.net/ \
              -c.win.azureSignOptions.codeSigningAccountName=eaonsigning \
              -c.win.azureSignOptions.certificateProfileName=eaon-public
          else
            npx electron-builder --win --publish never
          fi

      - name: Check the signature
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          foreach ($file in @((Get-ChildItem dist\*-setup.exe | Select-Object -First 1).FullName, 'dist\win-unpacked\Eaon.exe', 'dist\win-arm64-unpacked\Eaon.exe')) {
            if (-not (Test-Path $file)) { continue }
            $sig = Get-AuthenticodeSignature $file
            Write-Host "$file : $($sig.Status) by $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'CN=Vishnu Chada') { throw "$file is not signed by Vishnu Chada" }
          }

      # Like the Linux installers: onto the release for this version, once.
      - name: Attach to the release
        if: env.ATTACH == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if ! gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "No release v$VERSION yet; the files are on this run."
          elif gh release view "v$VERSION" --json assets -q '.assets[].name' | grep -qx latest.yml; then
            echo "v$VERSION already has its Windows files; they stay as published. This build is on the run."
          else
            gh release upload "v$VERSION" dist/*-setup.exe dist/*-setup.exe.blockmap dist/latest.yml --clobber
          fi

      - name: Keep the installer on the run
        uses: actions/upload-artifact@v4
        with:
          name: eaon-windows
          path: |
            dist/*-setup.exe
            dist/latest.yml
          if-no-files-found: error

  # The installer is installed silently (per user, no admin prompt, as a
  # double-click would), and the installed Eaon.exe is started and left for
  # 30 seconds: still running at the end, with nothing in its crash log, means
  # it came up. Then it is uninstalled again.
  smoke:
    name: Install and start (${{ matrix.arch }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: eaon-windows
          path: installer

      - name: Install, start, uninstall
        shell: pwsh
        run: |
          $setup = Get-ChildItem installer\*-setup.exe | Select-Object -First 1
          $sig = Get-AuthenticodeSignature $setup.FullName
          Write-Host "Installer signature: $($sig.Status) $($sig.SignerCertificate.Subject)"
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Eaon\Eaon.exe'
          for ($i = 0; $i -lt 60 -and -not (Test-Path $exe); $i++) { Start-Sleep -Seconds 2 }
          if (-not (Test-Path $exe)) { throw "The installer did not put Eaon.exe at $exe" }
          $arch = (Get-Item (Join-Path $env:LOCALAPPDATA 'Programs\Eaon\resources\llama') -ErrorAction SilentlyContinue | Get-ChildItem -Name)
          Write-Host "Installed $exe (llama-server for: $arch)"

          $app = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 30
          $crashLog = Join-Path $env:APPDATA 'Eaon\logs\crashes.log'
          if (Test-Path $crashLog) { Write-Host '--- crashes.log'; Get-Content $crashLog -Tail 40 }
          if ($app.HasExited) { throw "Eaon exited early (code $($app.ExitCode))" }
          # Main-process exceptions and renderer errors or deaths; a GPU entry on a
          # runner without a GPU is not Eaon's fault.
          if ((Test-Path $crashLog) -and (Select-String -Path $crashLog -Pattern '\[(main|renderer)' -Quiet)) { throw 'Eaon logged a crash while starting' }
          Get-Process -Name Eaon | Format-Table Id, CPU, WorkingSet64 -AutoSize
          Stop-Process -Name Eaon -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3

          $uninstaller = Join-Path $env:LOCALAPPDATA 'Programs\Eaon\Uninstall Eaon.exe'
          Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait
