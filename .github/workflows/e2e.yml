# End-to-end tests: the built app, started under a virtual display and driven
# over DevTools against a fake model server (test/e2e, npm run test:e2e).
#
# Runs on pull requests and by hand. It builds nothing for release, uploads
# nothing to a release and needs no secrets; the installers stay with
# linux.yml and the Mac/Windows scripts.
name: End-to-end tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # As linux.yml installs it: the lockfile as it is, --legacy-peer-deps
      # because betterwright's optional peer wants a newer Electron. node-pty
      # is compiled here (no Linux prebuild) against N-API, so the same binary
      # loads in Electron; electron-builder.yml has npmRebuild off for that.
      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Virtual display
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null

      - name: Build
        run: npx electron-vite build

      # The harness adds --no-sandbox, --disable-gpu and --password-store=basic
      # on Linux, and gives each scenario its own profile and HOME.
      - name: Run the scenarios
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" npm run test:e2e -- --no-build

      - name: Keep screenshots and app logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screens-and-logs
          path: |
            out/e2e/screens
            out/e2e/logs
          if-no-files-found: ignore
          retention-days: 14
