<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0d0d0d" />
    <title>Eaon Remote</title>
    <meta name="description" content="Control Eaon Desktop from anywhere: your ADE sessions, terminals and Workers." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Cpath fill='%23339CFF' fill-rule='evenodd' d='M186.6 50A100 100 0 1 0 186.6 150H103A15 15 0 0 1 103 120H197.98A100 100 0 0 0 197.98 80H103A15 15 0 0 1 103 50Z'/%3E%3C/svg%3E" />
    <script>
      // The theme before the first paint, so a light-mode visitor never sees a dark flash.
      try {
        var choice = localStorage.getItem('rc-theme') || 'system'
        document.documentElement.dataset.theme = choice === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : choice
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css" />
    <link rel="stylesheet" href="/app.css" />
    <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js" defer></script>
    <script src="/app.js" type="module"></script>
  </head>
  <body>
    <div id="app" aria-live="polite"></div>
    <noscript>Eaon Remote needs JavaScript.</noscript>
  </body>
</html>
