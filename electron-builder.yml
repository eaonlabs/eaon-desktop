# Both of these are load-bearing for updates from the previous (native Swift)
# macOS app: its SelfUpdateInstaller validates a downloaded bundle by requiring
# Contents/MacOS/Eaon to be executable and CFBundleIdentifier to equal exactly
# "dev.eaon.desktop", and rejects the update otherwise. electron-builder names
# the executable after productName, so productName must stay "Eaon".
appId: dev.eaon.desktop
productName: Eaon
directories:
  buildResources: resources
# Only the three bundles the app runs from. `out/` also collects test and
# verification builds (out/test, out/workers-full…), which `out/**` shipped
# inside the asar — and which break the universal merge whenever they change
# between the x64 and arm64 passes.
files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - package.json
  # BetterWright's optional extras that Eaon doesn't use: browser-cookie
  # import (a per-arch native module, which would also trip the universal
  # merge) and its patched Playwright.
  - '!**/node_modules/rookie-cookies*/**'
  - '!**/node_modules/patchright-core/**'
# node-pty's native module and its spawn-helper must be real files on disk:
# the helper is exec'd, which cannot happen from inside an asar archive.
asarUnpack:
  - node_modules/node-pty/**
# node-pty is the only native dependency, and it ships N-API prebuilds for
# every platform we build (prebuilds/darwin-*, win32-*), which Electron loads
# as they are. Rebuilding it from source is never needed — and fails outright
# on current Python, whose missing `distutils` breaks node-pty's bundled gyp.
npmRebuild: false
# The Chrome extension ships inside the app (Contents/Resources/extension) so
# "Load unpacked" works from an installed copy before, or without, the Chrome
# Web Store. Settings copies it to userData before revealing it, because
# Chrome's folder picker will not step inside an .app bundle.
extraResources:
  - from: extension
    to: extension
    filter:
      - '**/*'
      - '!STORE_LISTING.md'
publish:
  provider: github
  owner: eaonlabs
  repo: eaon-desktop
mac:
  category: public.app-category.productivity
  # The launch agent behind "Run in the background" (main/background.ts), in
  # Contents/Library/LaunchAgents where SMAppService looks for it. Registered
  # from inside the app, macOS shows it as Eaon's; a loose plist in
  # ~/Library/LaunchAgents read "Software from <whoever signed it>".
  extraFiles:
    - from: resources/mac/LaunchAgents
      to: Library/LaunchAgents
  # The pre-rendered icon, for macOS before 26. It, the Liquid Glass
  # Assets.car below and the Windows/Linux icons are all built from the Icon
  # Composer documents resources/Eaon.icon and EaonAgent.icon by
  # scripts/make-icon.py.
  icon: resources/icon.icns
  # Universal, not the host arch. The app this replaces shipped arm64+x86_64,
  # so an arm64-only build would strand every Intel user mid-update — their
  # installed copy would swap itself for a binary it cannot execute.
  target:
    - target: dmg
      arch: universal
    - target: zip
      arch: universal
  # Matches the previous app's artifact names (Eaon-<version>.dmg/.zip) rather
  # than electron-builder's default, which appends the architecture.
  artifactName: ${productName}-${version}.${ext}
  darkModeSupport: true
  # Shown when dictation first asks for the microphone; Electron's own line is generic.
  extendInfo:
    NSMicrophoneUsageDescription: Eaon uses the microphone when you dictate a message.
    # What macOS's Files and Folders prompt says. The ADE's terminals and agents
    # are Eaon as far as macOS is concerned: refused here, nothing started in a
    # project in Downloads can read it (main/features/terminals.ts says so).
    NSDownloadsFolderUsageDescription: Eaon's terminals and coding agents work in the project folders you open, including ones in Downloads.
    NSDocumentsFolderUsageDescription: Eaon's terminals and coding agents work in the project folders you open, including ones in Documents.
    NSDesktopFolderUsageDescription: Eaon's terminals and coding agents work in the project folders you open, including ones on the Desktop.
    # macOS 26+ draws the app icon from Assets.car (copied in by extraResources
    # below) under this name, with its dark, clear and tinted looks; older
    # macOS ignores it and uses icon.icns.
    CFBundleIconName: Eaon
  # Required for notarization, and already a prerequisite for the entitlements
  # below to mean anything.
  hardenedRuntime: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  # The universal merge lipos every Mach-O file that differs between the x64
  # and arm64 builds and rejects one that is identical but single-arch.
  # node-pty's prebuilds are both: the same per-arch folders ship in both
  # builds, and each loads only on its own arch, so they are kept as they are.
  # Same for Eaon's llama-server (llama/darwin-arm64, llama/darwin-x64) and
  # the Eaon CLI (eaon-cli/darwin-<arch>; only the arch that was built ships).
  # Cua Driver is already universal, the same file in both builds.
  x64ArchFiles: '{**/node_modules/node-pty/prebuilds/**,**/llama/darwin-*/**,**/eaon-cli/darwin-*/**,**/cua-driver/darwin/**}'
  # Eaon's own llama.cpp runtime (scripts/build-llama.sh), both Mac arches:
  # main/llama/runtime.ts picks the one matching the running process.
  extraResources:
    - from: resources/llama
      to: llama
      filter:
        - 'darwin-*/**'
    # Eaon CLI, the OpenCode fork (scripts/build-eaon-cli.sh; main/features/eaonCli.ts).
    - from: resources/eaon-cli
      to: eaon-cli
      filter:
        - 'darwin-*/**'
    # Cua Driver, the computer-use engine (scripts/fetch-cua-driver.mjs; main/features/computer/cua.ts).
    # Outside the asar with its executable bit, and signed with the app.
    - from: resources/cua-driver/darwin
      to: cua-driver/darwin
    # The Liquid Glass icon, compiled by scripts/make-icon.py (CFBundleIconName above).
    - from: resources/Assets.car
      to: Assets.car
    # The agent icon, for the Dock when it's picked in Settings (main/appIcon.ts).
    - from: resources/icon-agent.png
      to: icons/agent.png
  # The signing identity is deliberately NOT hardcoded here: this repo is public,
  # and the identity string contains the certificate holder's legal name.
  # electron-builder auto-selects the "Developer ID Application" certificate for
  # dmg/zip targets, which is the only correct choice anyway — the "Apple
  # Development" certificates also in this keychain are for local testing, and an
  # app signed with one will not launch on another machine or notarize at all.
  # Override with CSC_NAME="Developer ID Application: … (TEAMID)" if the keychain
  # ever holds more than one Developer ID certificate.
  #
  # Gatekeeper assessment during the build inspects the not-yet-notarized app and
  # so always fails; the real check is `spctl -a -vvv -t install` after stapling.
  gatekeeperAssess: false
  # Notarization credentials come from the environment and must never be
  # committed: set APPLE_ID and APPLE_APP_SPECIFIC_PASSWORD (an app-specific
  # password from appleid.apple.com, not the Apple ID password itself). Without
  # them the build fails at this step rather than silently shipping unnotarized.
  # The team ID comes from APPLE_TEAM_ID (exported by scripts/release-mac.sh)
  # rather than `notarize.teamId`, which electron-builder 25 deprecates.
  notarize: true
# Stamps Eaon.exe's icon and version with resedit instead of rcedit-under-wine
# (see the script for why); only acts on Windows builds.
afterPack: scripts/win-exe-resources.cjs
win:
  icon: resources/icon.ico
  # llama-server for each Windows arch (scripts/fetch-llama-windows.sh):
  # upstream's own builds, since they can't be compiled on a Mac.
  extraResources:
    - from: resources/llama/win32-${arch}
      to: llama/win32-${arch}
    - from: resources/eaon-cli/win32-${arch}
      to: eaon-cli/win32-${arch}
    - from: resources/cua-driver/win32-${arch}
      to: cua-driver/win32-${arch}
    # Window and taskbar icons for the Settings app-icon choice (main/appIcon.ts).
    - from: resources/icon.ico
      to: icons/default.ico
    - from: resources/icon-agent.ico
      to: icons/agent.ico
  # Off because rcedit needs an Intel wine that Apple silicon Macs can't run;
  # the afterPack hook above makes the same resource edits. Turn this back on
  # (and drop the hook) once these builds are Authenticode-signed on Windows.
  signAndEditExecutable: false
  # One installer carrying both Windows architectures, so a single .exe works
  # on any current PC: x64 for most, arm64 for Windows on ARM. NSIS picks the
  # right payload at install time. No ia32: node-pty has no 32-bit Windows
  # build and neither does llama-server, so a 32-bit Eaon had no terminal and
  # no local models — and the third payload made the installer half again as big.
  target:
    - target: nsis
      arch:
        - x64
        - arm64
  # Unsigned for now. Windows SmartScreen will show "Windows protected your PC"
  # on first run until these builds carry an Authenticode signature — click
  # More info -> Run anyway. Signing needs a code-signing certificate, which is
  # a separate purchase from the Apple Developer ID used for macOS.
  artifactName: ${productName}-${version}-setup.${ext}
# Linux: an AppImage (runs on most distributions, and updates itself) and a
# .deb, each for x64 and arm64. Built on Linux by .github/workflows/linux.yml:
# node-pty has no Linux prebuild, so it is compiled there, and so is
# llama-server (scripts/build-llama.sh).
#
# Ubuntu 23.10 and later block the unprivileged user namespaces Chromium's
# sandbox uses unless an AppArmor profile allows them, and a sandbox that can't
# start aborts Eaon before any of its code runs. electron-builder 26 covers
# both packages: the .deb installs an AppArmor profile, and the AppImage's
# launcher adds --no-sandbox only where namespaces are blocked (an AppImage
# can't carry a setuid sandbox helper).
linux:
  icon: resources/icon.png
  category: Utility
  executableName: eaon
  # The .desktop file, its StartupWMClass and Electron's own app id (Wayland)
  # all come from package.json's desktopName, so GNOME and KDE put the running
  # window under the installed launcher instead of a second, iconless entry.
  syncDesktopName: true
  synopsis: Every model, on your machine
  maintainer: Eaon <developer@eaon.dev>
  extraResources:
    - from: resources/llama/linux-${arch}
      to: llama/linux-${arch}
    - from: resources/eaon-cli/linux-${arch}
      to: eaon-cli/linux-${arch}
    - from: resources/cua-driver/linux-${arch}
      to: cua-driver/linux-${arch}
    # Window icons for the Settings app-icon choice (main/appIcon.ts).
    - from: resources/icon.png
      to: icons/default.png
    - from: resources/icon-agent.png
      to: icons/agent.png
  target:
    - AppImage
    - deb
deb:
  # electron-builder's default list plus the two libraries Electron loads that
  # it leaves out (ALSA, and GBM for the GPU process). Desktop installs nearly
  # always have both; minimal ones (WSL, a bare window manager) don't, and Eaon
  # then installed cleanly but failed to start. Ubuntu 24.04 renamed ALSA's
  # package (the 64-bit time_t transition), hence the alternative.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libgbm1
    - libasound2t64 | libasound2
# The AppImage runtime. The default (electron-builder's legacy one) loads
# libfuse.so.2, which Ubuntu 22.04 and later no longer install, so the
# AppImage did nothing when opened; its arm64 build also linked libz.so, which
# only exists with zlib's development package. 1.0.3 is the current
# statically linked runtime: it needs neither.
toolsets:
  appimage: '1.0.3'
nsis:
  # Newer NSIS (3.10+, e.g. Homebrew's native arm64 makensis, used on Apple
  # silicon Macs via ELECTRON_BUILDER_NSIS_DIR) warns about language strings
  # electron-builder's templates leave out; those warnings are not failures.
  warningsAsErrors: false
  # A per-user install needs no admin prompt, and is what lets the updater
  # replace the app without elevating.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Eaon
